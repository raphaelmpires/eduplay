<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPlay 🎮</title>
  <link rel="stylesheet" href="lib/eduplay.css">
  <link rel="stylesheet" href="lib/themes.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f0ff 0%, #f5e8ff 50%, #e8fff0 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    /* ====== NAME OVERLAY ====== */
    #name-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #e8f0ff 0%, #f5e8ff 50%, #e8fff0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .name-box {
      background: #fff;
      border-radius: 28px;
      padding: 44px 40px 36px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 16px 56px rgba(91, 141, 238, .18);
      animation: ep-pop-in .4s cubic-bezier(.34, 1.56, .64, 1);
    }

    .name-box-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 10px;
      animation: ep-float 3s ease-in-out infinite;
    }

    .name-box-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: #2d3561;
      margin-bottom: 6px;
    }

    .name-box-sub {
      color: #8892b0;
      font-weight: 600;
      margin-bottom: 24px;
      font-size: .95rem;
    }

    .name-input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      border: 2.5px solid #dce6ff;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #2d3561;
      text-align: center;
      outline: none;
      transition: border-color .2s;
    }

    .name-input:focus {
      border-color: #5b8dee;
    }

    .name-btn {
      margin-top: 16px;
      width: 100%;
      background: linear-gradient(135deg, #5b8dee, #9b5de5);
      color: #fff;
      border: none;
      border-radius: 50px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      padding: 15px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(91, 141, 238, .3);
      transition: transform .15s, box-shadow .15s;
    }

    .name-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(91, 141, 238, .4);
    }

    /* ====== USER BAR ====== */
    .user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      border-radius: 50px;
      padding: 8px 16px 8px 12px;
      box-shadow: 0 2px 12px rgba(91, 141, 238, .12);
      margin-bottom: 28px;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      color: #2d3561;
    }

    .user-bar-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #5b8dee, #9b5de5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }

    .user-bar-name {
      font-size: 1rem;
      flex: 1;
    }

    .user-bar-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8892b0;
      font-size: .85rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      padding: 4px 10px;
      border-radius: 20px;
      transition: background .15s, color .15s;
    }

    .user-bar-btn:hover {
      background: #f0f4ff;
      color: #5b8dee;
    }

    .user-bar-sep {
      color: #dce6ff;
    }

    /* ====== REST (unchanged from original) ====== */
    .hero {
      text-align: center;
      margin-bottom: 36px;
    }

    .hero-emoji {
      font-size: 5rem;
      display: block;
      animation: ep-float 3s ease-in-out infinite;
      margin-bottom: 12px;
    }

    .hero-title {
      font-family: 'Fredoka One', cursive;
      font-size: clamp(2.8rem, 8vw, 4.5rem);
      color: #2d3561;
      line-height: 1;
      margin-bottom: 8px;
    }

    .hero-title span {
      color: #5b8dee;
    }

    .hero-sub {
      font-size: 1.1rem;
      color: #8892b0;
      font-weight: 600;
    }

    .players {
      display: flex;
      gap: 16px;
      margin-bottom: 48px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .player-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 18px 28px;
      border-radius: 24px;
      border: 3px solid transparent;
      background: #fff;
      box-shadow: 0 4px 20px rgba(91, 141, 238, .1);
      cursor: pointer;
      transition: all .2s;
      font-family: 'Fredoka One', cursive;
      font-size: 1.3rem;
      color: #2d3561;
    }

    .player-btn .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin-bottom: 4px;
      transition: transform .2s;
      overflow: hidden;
    }

    .player-btn:hover .avatar {
      transform: scale(1.1) rotate(-5deg);
    }

    .player-btn:hover,
    .player-btn.active {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px rgba(91, 141, 238, .22);
    }

    .player-btn.all-btn {
      color: #1a7a47;
    }

    .player-btn.all-btn .avatar {
      background: linear-gradient(135deg, #43c97e, #1a7a47);
    }

    .player-btn.all-btn.active {
      border-color: #43c97e;
      background: #f0fff6;
    }

    .player-btn.charlie-btn {
      color: #d32f2f;
    }

    .player-btn.charlie-btn .avatar {
      background: none;
    }

    .player-btn.sophia-btn .avatar {
      background: none;
    }

    .player-btn .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-btn.charlie-btn.active {
      border-color: #d32f2f;
      background: #fff5f5;
    }

    .player-btn.sophia-btn {
      color: #1a6fc4;
    }

    .player-btn.sophia-btn .avatar {
      background: linear-gradient(135deg, #1a6fc4, #0d47a1);
    }

    .player-btn.sophia-btn.active {
      border-color: #1a6fc4;
      background: #f0f6ff;
    }

    .spider-man-icon {
      width: 48px;
      height: 48px;
    }

    .stitch-icon {
      width: 48px;
      height: 48px;
    }

    /* Label temática dentro do botão do jogador */
    .player-label {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-theme-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
    }

    .games-section {
      width: 100%;
      max-width: 860px;
    }

    .games-section-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: #8892b0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .games-section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, #dce6ff, transparent);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .game-card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(91, 141, 238, .1);
      cursor: pointer;
      transition: all .2s;
      text-decoration: none;
      display: block;
      position: relative;
      overflow: hidden;
      border: 2.5px solid transparent;
    }

    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 36px rgba(0, 0, 0, .14);
    }

    .game-card-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      border-radius: 24px 24px 0 0;
    }

    .game-card-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      transition: transform .2s;
      overflow: hidden;
    }

    .game-card:hover .game-card-avatar {
      transform: scale(1.12) rotate(-6deg);
    }

    .game-card-badge {
      position: absolute;
      top: 18px;
      right: 18px;
      color: #fff;
      font-family: 'Fredoka One', cursive;
      font-size: .8rem;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .game-card-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.35rem;
      color: #2d3561;
      margin-bottom: 4px;
    }

    .game-card-desc {
      font-size: .87rem;
      color: #8892b0;
      font-weight: 600;
      line-height: 1.4;
    }

    .game-card-stars {
      margin-top: 12px;
      display: flex;
      gap: 3px;
    }

    .game-card-stars span {
      font-size: 1rem;
    }

    .game-card.locked {
      opacity: .5;
      cursor: not-allowed;
      filter: grayscale(.8);
    }

    .game-card.locked:hover {
      transform: none;
    }

    .game-card-add {
      border: 3px dashed #c0cfe8;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      gap: 8px;
      color: #8892b0;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: default;
      box-shadow: none;
    }

    .game-card-add:hover {
      transform: none;
      box-shadow: none;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #8892b0;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      grid-column: 1/-1;
    }

    /* ====== RESET MODAL ====== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 70, .6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
    }

    .modal-box {
      background: #fff;
      border-radius: 24px;
      padding: 36px 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
      animation: ep-pop-in .3s cubic-bezier(.34, 1.56, .64, 1);
    }

    .modal-box h3 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      color: #2d3561;
      margin-bottom: 8px;
    }

    .modal-box p {
      color: #8892b0;
      font-weight: 600;
      margin-bottom: 22px;
      font-size: .93rem;
    }

    .modal-btns {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-btn {
      padding: 12px 20px;
      border-radius: 50px;
      border: none;
      font-family: 'Fredoka One', cursive;
      font-size: 1rem;
      cursor: pointer;
      transition: transform .15s;
    }

    .modal-btn:hover {
      transform: translateY(-1px);
    }

    .modal-btn-danger {
      background: #ff5c6a;
      color: #fff;
    }

    .modal-btn-neutral {
      background: #f0f4ff;
      color: #2d3561;
    }
  </style>
</head>

<body>

  <!-- NAME OVERLAY -->
  <div id="name-overlay">
    <div class="name-box">
      <span class="name-box-emoji">🎮</span>
      <h1 class="name-box-title">Bem-vindo ao EduPlay!</h1>
      <p class="name-box-sub">Qual é o seu nome? Vamos salvar seu progresso!</p>
      <input class="name-input" id="name-input" type="text" placeholder="Digite seu nome..." maxlength="24"
        autocomplete="off">
      <button class="name-btn" id="name-btn" onclick="saveName()">🚀 Vamos jogar!</button>
    </div>
  </div>

  <!-- RESET MODAL -->
  <div id="reset-modal" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3>⚙️ Configurações</h3>
      <p>Olá, <strong id="modal-username"></strong>! O que deseja fazer?</p>
      <div class="modal-btns">
        <button class="modal-btn modal-btn-danger" onclick="confirmReset()">🗑️ Apagar meu progresso</button>
        <button class="modal-btn modal-btn-neutral" onclick="changeName()">✏️ Trocar nome</button>
        <button class="modal-btn modal-btn-neutral" onclick="closeModal()">✖ Cancelar</button>
      </div>
    </div>
  </div>

  <div class="hero">
    <span class="hero-emoji">🎮</span>
    <h1 class="hero-title">Edu<span>Play</span></h1>
    <p class="hero-sub">Aprender nunca foi tão divertido!</p>
  </div>

  <!-- USER BAR -->
  <div class="user-bar" id="user-bar">
    <div class="user-bar-avatar">👤</div>
    <span class="user-bar-name" id="user-bar-name">—</span>
    <span class="user-bar-sep">|</span>
    <button class="user-bar-btn" onclick="openModal()">⚙️ Opções</button>
  </div>

  <div class="players">
    <button class="player-btn all-btn active" onclick="selectPlayer('all')" id="btn-all">
      <div class="avatar">🎮</div>
      Todos
    </button>
    <button class="player-btn charlie-btn" onclick="selectPlayer('charlie')" id="btn-charlie">
      <div class="avatar">
        <img src="assets/homem%20aranha.png" alt="Spider-Man" width="84" height="84">
      </div>
      <div class="player-label">
        <span class="player-theme-badge">
          <svg viewBox="0 0 32 24" width="22" height="16" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="16" cy="17" rx="4.5" ry="5.5" fill="#CC0000" />
            <circle cx="16" cy="9" r="3.8" fill="#CC0000" />
            <line x1="12" y1="10" x2="2" y2="4" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="12" y1="13" x2="1" y2="12" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="20" y1="10" x2="30" y2="4" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="20" y1="13" x2="31" y2="12" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="12" y1="18" x2="1" y2="19" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="12" y1="21" x2="3" y2="24" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="20" y1="18" x2="31" y2="19" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
            <line x1="20" y1="21" x2="29" y2="24" stroke="#CC0000" stroke-width="2.5" stroke-linecap="round" />
          </svg>
        </span>
        Charlie
      </div>
    </button>
    <button class="player-btn sophia-btn" onclick="selectPlayer('sophia')" id="btn-sophia">
      <div class="avatar">
        <img src="assets/stitch.png" alt="Stitch" width="84" height="84">
      </div>
      <div class="player-label">
        <span class="player-theme-badge">🐾</span>
        Sophia
      </div>
    </button>
  </div>

  <div class="games-section">
    <div class="games-section-title">📚 Jogos Disponíveis</div>
    <div class="games-grid" id="games-grid"></div>
  </div>

  <script>
    const GAMES_REGISTRY = [
      {
        id: 'charlie-unit1',
        title: 'Escola & Aventuras',
        desc: 'Materiais escolares, transportes, emoções e os 5 sentidos!',
        avatarHtml: `<img src="assets/homem%20aranha.png" alt="Spider-Man" style="width:100%;height:100%;object-fit:contain;">`,
        avatarBg: 'transparent',
        player: 'charlie',
        unit: 'Unit 1',
        badgeBg: '#d32f2f',
        stripe: 'linear-gradient(90deg,#d32f2f,#1565c0)',
        url: 'games/charlie-unit1/index.html',
        locked: false,
      },
    ];

    // ====== NOME / PERFIL ======
    function currentUser() {
      return localStorage.getItem('eduplay_current_user') || '';
    }
    function userKey(gameId) {
      const u = (currentUser() || 'default').toLowerCase().replace(/\s+/g, '_');
      return `eduplay_${u}_progress_${gameId}`;
    }

    function saveName() {
      const val = document.getElementById('name-input').value.trim();
      if (!val) { document.getElementById('name-input').focus(); return; }
      localStorage.setItem('eduplay_current_user', val);
      document.getElementById('name-overlay').style.display = 'none';
      updateUserBar();
      renderGames();
    }

    function updateUserBar() {
      const name = currentUser();
      document.getElementById('user-bar-name').textContent = '👋 ' + (name || '—');
    }

    function openModal() {
      document.getElementById('modal-username').textContent = currentUser();
      document.getElementById('reset-modal').style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('reset-modal').style.display = 'none';
    }
    function changeName() {
      localStorage.removeItem('eduplay_current_user');
      closeModal();
      document.getElementById('name-overlay').style.display = 'flex';
      document.getElementById('name-input').value = '';
    }
    function confirmReset() {
      if (!confirm(`Apagar TODO o progresso de "${currentUser()}"? Isso não pode ser desfeito.`)) return;
      // Apaga todas as chaves do usuário atual
      const u = (currentUser() || 'default').toLowerCase().replace(/\s+/g, '_');
      const prefix = `eduplay_${u}_progress_`;
      Object.keys(localStorage).filter(k => k.startsWith(prefix)).forEach(k => localStorage.removeItem(k));
      closeModal();
      renderGames(); // atualiza estrelas
    }

    // ====== JOGOS ======
    let currentPlayer = 'all';

    function selectPlayer(p) {
      currentPlayer = p;
      document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-' + p).classList.add('active');
      renderGames();
    }

    function getStars(id) {
      try {
        const d = JSON.parse(localStorage.getItem(userKey(id)) || 'null');
        return d?.stars || 0;
      } catch (e) { return 0; }
    }

    function renderGames() {
      const grid = document.getElementById('games-grid');
      const list = currentPlayer === 'all' ? GAMES_REGISTRY : GAMES_REGISTRY.filter(g => g.player === currentPlayer);
      const cards = list.map(g => {
        const stars = getStars(g.id);
        const starHTML = [1, 2, 3].map(i => `<span>${i <= stars ? '⭐' : '☆'}</span>`).join('');
        return `<a href="${g.locked ? '#' : g.url}" class="game-card${g.locked ? ' locked' : ''}" ${g.locked ? 'onclick="return false"' : ''}>
      <div class="game-card-stripe" style="background:${g.stripe}"></div>
      <div class="game-card-avatar" style="background:${g.avatarBg}">${g.avatarHtml}</div>
      <div class="game-card-badge" style="background:${g.badgeBg}">${g.unit}</div>
      <div class="game-card-title">${g.title}</div>
      <div class="game-card-desc">${g.desc}</div>
      <div class="game-card-stars">${starHTML}</div>
      ${g.locked ? '<div style="margin-top:8px;color:#8892b0;font-size:.85rem;font-weight:700;">🔒 Em breve</div>' : ''}
    </a>`;
      }).join('');
      const addCard = `<div class="game-card game-card-add"><span style="font-size:2.5rem">➕</span>Novo jogo<small style="font-family:Nunito;font-size:.78rem;color:#b0bec5;text-align:center">Adicione em<br>index.html</small></div>`;
      grid.innerHTML = list.length === 0 ? `<div class="empty-state">🌟 Nenhum jogo ainda!</div>` + addCard : cards + addCard;
    }

    // ====== INIT ======
    (function init() {
      const name = currentUser();
      if (name) {
        document.getElementById('name-overlay').style.display = 'none';
        updateUserBar();
        renderGames();
      } else {
        // Foca automaticamente no input
        setTimeout(() => document.getElementById('name-input').focus(), 200);
      }

      // Enter no input submete
      document.getElementById('name-input').addEventListener('keydown', e => {
        if (e.key === 'Enter') saveName();
      });
    })();
  </script>
</body>

</html>
